<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CX Versions</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #68625d;
        --line: #e8e0d8;
        --paper: #f8f4ef;
        --accent: #ff6a1a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }

      main {
        width: min(100%, 560px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 0.95;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .links {
        display: grid;
        gap: 12px;
      }

      a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 64px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff;
        color: var(--ink);
        font-weight: 750;
        text-decoration: none;
      }

      a span {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CX</h1>
      <p>Published preview versions.</p>
      <div class="links">
        <a href="./cx-v1/">CX V1 <span>/cx-v1</span></a>
        <a href="./cx-v2/">CX V2 <span>/cx-v2</span></a>
      </div>
    </main>
  </body>
</html>
