<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Projektmanagement-Methodenstack: Waterfall, Hybrid, Agile, Scrum">
  <defs>
    <style>
      .bg{fill:#FAF6EC}
      .ink{fill:#1E2327}
      .grey{fill:#5A6066}
      .purple{fill:#7C3AED}
      .yellow{fill:#FFD24A}
      .stroke{fill:none;stroke:#1E2327;stroke-width:1.4}
      .strokeLight{fill:none;stroke:#1E2327;stroke-width:0.8;opacity:0.35}
      .label{font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:700;fill:#1E2327;letter-spacing:-0.01em}
      .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:500;fill:#5A6066;letter-spacing:0.04em;text-transform:uppercase}
      .title{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:800;fill:#5A6066;letter-spacing:0.16em;text-transform:uppercase}
      .num{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:800;fill:#FAF6EC;letter-spacing:0.04em}
    </style>
  </defs>
  <rect class="bg" width="600" height="400"/>

  <!-- Title strip -->
  <text class="title" x="40" y="44">PM-Methodenstack · vier Ebenen</text>
  <line class="strokeLight" x1="40" y1="56" x2="560" y2="56"/>

  <!-- Stack layers (bottom = foundation, top = team practice) -->
  <!-- Layer 1 — Waterfall (foundation) -->
  <rect class="ink" x="40" y="306" width="520" height="50" rx="2"/>
  <rect class="yellow" x="40" y="306" width="6" height="50"/>
  <text class="label" x="64" y="330" style="fill:#FAF6EC">Waterfall · PMI/Prince2</text>
  <text class="sub" x="64" y="346" style="fill:#FAF6EC;opacity:0.7">Plan · Auftrag · Lieferpfad · audit-fest</text>
  <rect class="purple" x="500" y="318" width="44" height="26" rx="2"/>
  <text class="num" x="510" y="335">FOUNDATION</text>

  <!-- Layer 2 — Hybrid -->
  <rect class="ink" x="40" y="240" width="520" height="50" rx="2" style="opacity:0.88"/>
  <rect class="yellow" x="40" y="240" width="6" height="50"/>
  <text class="label" x="64" y="264" style="fill:#FAF6EC">Hybrid · Plan + Sprint</text>
  <text class="sub" x="64" y="280" style="fill:#FAF6EC;opacity:0.7">Klassisch geplant · agil geliefert · Übergaben definiert</text>

  <!-- Layer 3 — Agile (SAFe / LeSS) -->
  <rect class="purple" x="40" y="174" width="520" height="50" rx="2"/>
  <rect class="yellow" x="40" y="174" width="6" height="50"/>
  <text class="label" x="64" y="198" style="fill:#FAF6EC">Agile Skalierung · SAFe · LeSS · Kanban</text>
  <text class="sub" x="64" y="214" style="fill:#FAF6EC;opacity:0.85">Programm-Inkremente · Multi-Team-Synchronisation</text>

  <!-- Layer 4 — Scrum (team practice) -->
  <rect class="yellow" x="40" y="108" width="520" height="50" rx="2"/>
  <rect class="ink" x="40" y="108" width="6" height="50"/>
  <text class="label" x="64" y="132">Scrum · Team-Praxis</text>
  <text class="sub" x="64" y="148">Sprint · Backlog · Product Owner · Scrum Master</text>
  <rect class="ink" x="500" y="120" width="44" height="26" rx="2"/>
  <text class="num" x="514" y="137">TEAM</text>

  <!-- Connector arrows on left -->
  <path class="stroke" d="M 22 330 L 22 132" stroke-dasharray="2 3"/>
  <path class="stroke" d="M 18 132 L 22 124 L 26 132"/>
  <text class="sub" x="6" y="230" transform="rotate(-90 14 230)">Detail · Iterationstakt</text>

  <!-- Footer caption -->
  <text class="sub" x="40" y="382">Wir wählen pro Phase die Ebene, die zum Vorhaben passt — kein Framework-Dogma.</text>
</svg>
