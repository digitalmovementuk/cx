<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Project-Recovery-Timeline: entgleistes Projekt zurück in den Takt">
  <defs>
    <style>
      .bg{fill:#FAF6EC}
      .ink{fill:#1E2327}
      .grey{fill:#5A6066}
      .purple{fill:#7C3AED}
      .yellow{fill:#FFD24A}
      .stroke{fill:none;stroke:#1E2327;stroke-width:1.4}
      .strokeDash{fill:none;stroke:#5A6066;stroke-width:1.2;stroke-dasharray:3 4;opacity:0.7}
      .strokePurple{fill:none;stroke:#7C3AED;stroke-width:2.2}
      .strokeYellow{fill:none;stroke:#FFD24A;stroke-width:2.6}
      .label{font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:700;fill:#1E2327;letter-spacing:-0.01em}
      .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:500;fill:#5A6066;letter-spacing:0.02em}
      .title{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:800;fill:#5A6066;letter-spacing:0.16em;text-transform:uppercase}
      .pill{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase}
    </style>
  </defs>
  <rect class="bg" width="600" height="400"/>

  <!-- Title -->
  <text class="title" x="40" y="44">Project Recovery · Termin zurück in den Takt</text>
  <line class="strokeDash" x1="40" y1="56" x2="560" y2="56"/>

  <!-- Axes -->
  <!-- Y axis (Fortschritt) -->
  <line class="stroke" x1="60" y1="80" x2="60" y2="320"/>
  <line class="stroke" x1="60" y1="320" x2="560" y2="320"/>

  <!-- Y labels -->
  <text class="sub" x="14" y="86">100%</text>
  <text class="sub" x="14" y="204">50%</text>
  <text class="sub" x="14" y="324">0%</text>

  <!-- X labels (months) -->
  <text class="sub" x="60" y="344">M0</text>
  <text class="sub" x="160" y="344">M2</text>
  <text class="sub" x="260" y="344">M4</text>
  <text class="sub" x="360" y="344">M6</text>
  <text class="sub" x="460" y="344">M8</text>
  <text class="sub" x="540" y="344">M10</text>

  <!-- Plan baseline (dashed) -->
  <line class="strokeDash" x1="60" y1="320" x2="540" y2="80"/>
  <text class="sub" x="466" y="78" style="fill:#5A6066">Plan</text>

  <!-- Pre-audit drift curve (grey, shallow) -->
  <path class="strokeDash" d="M 60 320 Q 110 295 160 282 T 260 264" style="stroke:#5A6066;stroke-width:2;opacity:0.85;stroke-dasharray:none"/>
  <circle cx="260" cy="264" r="4" class="grey"/>

  <!-- Audit marker -->
  <line class="strokePurple" x1="260" y1="80" x2="260" y2="320" style="stroke-dasharray:2 4"/>
  <rect class="purple" x="220" y="64" width="80" height="22" rx="2"/>
  <text class="pill" x="232" y="79" style="fill:#FAF6EC">AUDIT · W2-3</text>

  <!-- Recovery curve (yellow, steep) -->
  <path class="strokeYellow" d="M 260 264 Q 310 220 360 180 T 460 116 T 540 88"/>
  <circle cx="540" cy="88" r="5" class="yellow"/>
  <circle cx="540" cy="88" r="2" class="ink"/>

  <!-- Section labels -->
  <text class="label" x="80" y="264" style="fill:#5A6066">Pre-Audit · Drift</text>
  <text class="sub" x="80" y="278" style="fill:#5A6066">Steuerung ohne Entscheidung</text>

  <text class="label" x="310" y="170" style="fill:#7C3AED">Recovery-Pfad</text>
  <text class="sub" x="310" y="184" style="fill:#5A6066">Auftrag · Rollen · Lieferdisziplin</text>

  <text class="label" x="430" y="78">Stabilisierung</text>

  <!-- Footer caption -->
  <text class="sub" x="40" y="380">Audit in 2-3 Wochen · Recovery-Plan · Stabilisierung in 4-6 Monaten typisch.</text>
</svg>
