<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Digitalisierungs-Stack in fünf Schichten">
  <defs>
    <style>
      .ink{fill:#1E2327}
      .cream{fill:#FAF6EC}
      .purple{fill:#7C3AED}
      .yellow{fill:#FFD24A}
      .grey{fill:#5A6066}
      .title{font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:800;fill:#1E2327;letter-spacing:-0.01em}
      .layer-l{font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:800;fill:#FAF6EC;letter-spacing:0.02em}
      .layer-l-dark{font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:800;fill:#1E2327;letter-spacing:0.02em}
      .layer-d{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:500;fill:#FAF6EC;opacity:0.85}
      .layer-d-dark{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:500;fill:#1E2327;opacity:0.85}
      .sub{font-family:Inter,system-ui,sans-serif;font-size:9px;font-weight:500;fill:#5A6066}
      .num{font-family:Inter,system-ui,sans-serif;font-size:9px;font-weight:800;letter-spacing:0.08em}
      .axis{stroke:#1E2327;stroke-width:1;fill:none}
    </style>
  </defs>
  <rect class="cream" width="600" height="400"/>
  <text class="title" x="40" y="40">Digitalisierungs-Stack · 5 Schichten, die zusammenpassen müssen</text>
  <line x1="40" y1="58" x2="120" y2="58" stroke="#7C3AED" stroke-width="3"/>

  <!-- Layer 5: Kultur (top) -->
  <rect class="yellow" x="120" y="80" width="380" height="42" rx="2"/>
  <text class="num" x="135" y="98" fill="#1E2327">05</text>
  <text class="layer-l-dark" x="160" y="100">Kultur · Adoption · Change</text>
  <text class="layer-d-dark" x="160" y="115">ADKAR · Stakeholder · Schulung · Schatten-IT-Vermeidung</text>

  <!-- Layer 4: Prozesse -->
  <rect class="purple" x="120" y="130" width="380" height="42" rx="2"/>
  <text class="num" x="135" y="148" fill="#FFD24A">04</text>
  <text class="layer-l" x="160" y="150">Prozesse · Workflows · Automation</text>
  <text class="layer-d" x="160" y="165">BPMN · Process Mining · End-to-End-Digitalisierung · RPA</text>

  <!-- Layer 3: Anwendungen -->
  <rect class="ink" x="120" y="180" width="380" height="42" rx="2"/>
  <text class="num" x="135" y="198" fill="#FFD24A">03</text>
  <text class="layer-l" x="160" y="200">Anwendungen · ERP · CRM · SaaS</text>
  <text class="layer-d" x="160" y="215">SAP S/4HANA · Microsoft Dynamics · Salesforce · Workday · Best-of-Breed</text>

  <!-- Layer 2: Daten -->
  <rect class="grey" x="120" y="230" width="380" height="42" rx="2"/>
  <text class="num" x="135" y="248" fill="#FFD24A">02</text>
  <text class="layer-l" x="160" y="250">Daten · Stammdaten · Analytics</text>
  <text class="layer-d" x="160" y="265">Master Data Management · Data Lakehouse · Governance · KPI-Modell</text>

  <!-- Layer 1: Infrastruktur (bottom) -->
  <rect class="ink" x="120" y="280" width="380" height="42" rx="2"/>
  <text class="num" x="135" y="298" fill="#FFD24A">01</text>
  <text class="layer-l" x="160" y="300">Infrastruktur · Cloud · OT/IT</text>
  <text class="layer-d" x="160" y="315">Azure · AWS · GCP · Sovereign Cloud · Netzwerk · Industrie-4.0-Sensorik</text>

  <!-- Axis arrow on left -->
  <path class="axis" d="M70 320 L70 80 M66 86 L70 80 L74 86"/>
  <text class="sub" x="60" y="200" text-anchor="middle" transform="rotate(-90 60 200)">Geschäftswirkung ↑</text>

  <!-- Footer -->
  <text class="sub" x="40" y="360" fill="#5A6066">Reifegrad-Lücken in unteren Schichten blockieren obere · Digitalisierung beginnt unten, Wirkung entsteht oben</text>
  <text class="sub" x="40" y="375" fill="#5A6066">Wir bewerten alle 5 Schichten gemeinsam — Mittelstand bis DAX-Konzern, anbieter-unabhängig.</text>
</svg>
