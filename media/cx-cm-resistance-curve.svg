<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="rcTitle rcDesc">
  <title id="rcTitle">Veraenderungskurve nach Kuebler-Ross</title>
  <desc id="rcDesc">Verlauf der emotionalen Energie waehrend eines Change-Vorhabens ueber sieben Phasen.</desc>
  <rect width="600" height="400" fill="#FAF6EC"/>
  <text x="40" y="40" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1E2327">Veraenderungskurve</text>
  <text x="40" y="60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5A6066">Emotionaler Verlauf nach Kuebler-Ross &mdash; Tal-der-Traenen-Phase</text>
  <!-- Axes -->
  <line x1="60" y1="100" x2="60" y2="330" stroke="#1E2327" stroke-width="1.5"/>
  <line x1="60" y1="330" x2="560" y2="330" stroke="#1E2327" stroke-width="1.5"/>
  <text x="20" y="115" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5A6066">Energie</text>
  <text x="520" y="350" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5A6066">Zeit</text>
  <!-- Curve: starts mid, dips, recovers higher -->
  <path d="M 60 180 Q 110 130, 150 170 T 250 290 T 360 270 T 460 200 T 560 130" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom shading -->
  <path d="M 60 180 Q 110 130, 150 170 T 250 290 T 360 270 T 460 200 T 560 130 L 560 330 L 60 330 Z" fill="#7C3AED" opacity="0.08"/>
  <!-- Phase markers -->
  <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#1E2327" text-anchor="middle">
    <circle cx="90" cy="175" r="5" fill="#FFD24A" stroke="#1E2327" stroke-width="1.5"/>
    <text x="90" y="350" font-size="9" font-weight="700">Schock</text>
    <circle cx="150" cy="170" r="5" fill="#FFD24A" stroke="#1E2327" stroke-width="1.5"/>
    <text x="150" y="350" font-size="9" font-weight="700">Verneinung</text>
    <circle cx="225" cy="260" r="5" fill="#7C3AED"/>
    <text x="225" y="350" font-size="9" font-weight="700">Frustration</text>
    <circle cx="285" cy="295" r="6" fill="#1E2327"/>
    <text x="285" y="350" font-size="9" font-weight="800">Tal</text>
    <circle cx="360" cy="270" r="5" fill="#7C3AED"/>
    <text x="360" y="350" font-size="9" font-weight="700">Akzeptanz</text>
    <circle cx="445" cy="210" r="5" fill="#FFD24A" stroke="#1E2327" stroke-width="1.5"/>
    <text x="445" y="350" font-size="9" font-weight="700">Lernen</text>
    <circle cx="540" cy="140" r="6" fill="#FFD24A" stroke="#1E2327" stroke-width="1.5"/>
    <text x="540" y="350" font-size="9" font-weight="800">Integration</text>
  </g>
  <!-- Intervention bands -->
  <line x1="60" y1="180" x2="560" y2="180" stroke="#1E2327" stroke-width="1" opacity="0.2" stroke-dasharray="3 4"/>
  <text x="68" y="172" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#5A6066">Ausgangs-Niveau</text>
  <!-- Annotation -->
  <rect x="200" y="100" width="180" height="44" fill="#1E2327"/>
  <text x="290" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFD24A">CHANGE-INTERVENTION</text>
  <text x="290" y="134" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FAF6EC">Coaching &middot; Dialog &middot; Champions</text>
  <line x1="290" y1="144" x2="285" y2="285" stroke="#1E2327" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
</svg>
