<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Governance-Grid: Strategisch, Taktisch, Operativ über Plan und Execute">
  <defs>
    <style>
      .bg{fill:#FAF6EC}
      .ink{fill:#1E2327}
      .grey{fill:#5A6066}
      .purple{fill:#7C3AED}
      .yellow{fill:#FFD24A}
      .stroke{fill:none;stroke:#1E2327;stroke-width:1.4}
      .strokeLight{fill:none;stroke:#1E2327;stroke-width:0.8;opacity:0.35}
      .cellPlan{fill:#FAF6EC;stroke:#1E2327;stroke-width:1.2}
      .cellExec{fill:#FFFFFF;stroke:#1E2327;stroke-width:1.2}
      .colLabel{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:800;fill:#1E2327;letter-spacing:0.16em;text-transform:uppercase}
      .rowLabel{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:800;fill:#1E2327;letter-spacing:0.16em;text-transform:uppercase}
      .cellH{font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:800;fill:#1E2327;letter-spacing:-0.01em}
      .cellP{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:500;fill:#5A6066;letter-spacing:0.01em}
      .title{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:800;fill:#5A6066;letter-spacing:0.16em;text-transform:uppercase}
      .tag{font-family:Inter,system-ui,sans-serif;font-size:9px;font-weight:800;fill:#1E2327;letter-spacing:0.08em;text-transform:uppercase}
    </style>
  </defs>
  <rect class="bg" width="600" height="400"/>

  <!-- Title -->
  <text class="title" x="40" y="36">Governance-Grid · Steuerung über drei Ebenen</text>
  <line class="strokeLight" x1="40" y1="46" x2="560" y2="46"/>

  <!-- Column headers -->
  <text class="colLabel" x="218" y="74">PLAN</text>
  <text class="colLabel" x="412" y="74">EXECUTE</text>

  <!-- Yellow accent under col headers -->
  <rect class="yellow" x="180" y="80" width="160" height="3"/>
  <rect class="purple" x="370" y="80" width="160" height="3"/>

  <!-- Row 1 — Strategisch -->
  <text class="rowLabel" x="40" y="124">STRATEGISCH</text>
  <rect class="cellPlan" x="180" y="96" width="160" height="78"/>
  <text class="cellH" x="194" y="122">Programm-Charter</text>
  <text class="cellP" x="194" y="140">Ziele · Business Case</text>
  <text class="cellP" x="194" y="156">Lenkungsausschuss-Setup</text>
  <rect class="ink" x="296" y="100" width="40" height="14"/>
  <text class="tag" x="304" y="110" style="fill:#FFD24A">CEO/CIO</text>

  <rect class="cellExec" x="370" y="96" width="160" height="78"/>
  <text class="cellH" x="384" y="122">Lenkungsausschuss</text>
  <text class="cellP" x="384" y="140">Monatlicher Takt</text>
  <text class="cellP" x="384" y="156">Eskalation · Entscheidung</text>
  <rect class="purple" x="486" y="100" width="40" height="14"/>
  <text class="tag" x="492" y="110" style="fill:#FAF6EC">MONAT</text>

  <!-- Row 2 — Taktisch -->
  <text class="rowLabel" x="40" y="220">TAKTISCH</text>
  <rect class="cellPlan" x="180" y="194" width="160" height="78"/>
  <text class="cellH" x="194" y="220">Roadmap · PMO-Plan</text>
  <text class="cellP" x="194" y="238">Lieferpfad · Abhängigkeiten</text>
  <text class="cellP" x="194" y="254">Ressourcen-Allokation</text>
  <rect class="ink" x="296" y="198" width="40" height="14"/>
  <text class="tag" x="306" y="208" style="fill:#FFD24A">PMO</text>

  <rect class="cellExec" x="370" y="194" width="160" height="78"/>
  <text class="cellH" x="384" y="220">Projekt-Jour-Fixe</text>
  <text class="cellP" x="384" y="238">Wöchentlicher Takt</text>
  <text class="cellP" x="384" y="254">Risiko · Status · Forecast</text>
  <rect class="purple" x="486" y="198" width="40" height="14"/>
  <text class="tag" x="494" y="208" style="fill:#FAF6EC">WOCHE</text>

  <!-- Row 3 — Operativ -->
  <text class="rowLabel" x="40" y="316">OPERATIV</text>
  <rect class="cellPlan" x="180" y="290" width="160" height="78"/>
  <text class="cellH" x="194" y="316">Sprint- · Iterations-Plan</text>
  <text class="cellP" x="194" y="334">Backlog-Refinement</text>
  <text class="cellP" x="194" y="350">Definition of Done</text>
  <rect class="ink" x="296" y="294" width="40" height="14"/>
  <text class="tag" x="298" y="304" style="fill:#FFD24A">TEAMS</text>

  <rect class="cellExec" x="370" y="290" width="160" height="78"/>
  <text class="cellH" x="384" y="316">Daily · Stand-up</text>
  <text class="cellP" x="384" y="334">Täglicher Takt</text>
  <text class="cellP" x="384" y="350">Impediment-Klärung</text>
  <rect class="purple" x="486" y="294" width="40" height="14"/>
  <text class="tag" x="498" y="304" style="fill:#FAF6EC">TAG</text>

  <!-- Caption -->
  <text class="title" x="40" y="392" style="font-size:10px">Sechs Felder · jedes mit Rolle · Takt · Output. So bleibt Steuerung verbindlich.</text>
</svg>
