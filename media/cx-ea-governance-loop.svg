<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t-gov-title">
  <title id="t-gov-title">Architektur-Governance-Loop — Architecture Board und ADR-Prozess</title>
  <rect width="600" height="400" fill="#FAF6EC"/>
  <text x="40" y="42" font-family="Inter,sans-serif" font-size="13" font-weight="800" fill="#1E2327" letter-spacing="0.04em">ARCHITEKTUR-GOVERNANCE-LOOP</text>
  <text x="40" y="60" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#5A6066">Architecture Board · ADR · Review-Zyklus</text>

  <!-- 5-step loop arranged horizontally -->
  <!-- 01 Propose -->
  <g>
    <rect x="36" y="120" width="104" height="120" fill="#FFFFFF" stroke="#1E2327" stroke-width="1.4" rx="2"/>
    <rect x="36" y="120" width="104" height="22" fill="#7C3AED"/>
    <text x="88" y="136" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#FAF6EC" letter-spacing="0.08em">01 · PROPOSE</text>
    <text x="88" y="166" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="800" fill="#1E2327">RFC</text>
    <text x="88" y="186" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">Team reicht</text>
    <text x="88" y="200" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">Vorschlag ein</text>
    <text x="88" y="220" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#7C3AED" letter-spacing="0.06em">DOMAIN-TEAM</text>
  </g>
  <!-- arrow -->
  <g fill="#1E2327"><polygon points="148,180 168,172 168,188"/></g>
  <!-- 02 Review -->
  <g>
    <rect x="172" y="120" width="104" height="120" fill="#FFFFFF" stroke="#1E2327" stroke-width="1.4" rx="2"/>
    <rect x="172" y="120" width="104" height="22" fill="#1E2327"/>
    <text x="224" y="136" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#FFD24A" letter-spacing="0.08em">02 · REVIEW</text>
    <text x="224" y="166" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="800" fill="#1E2327">BOARD</text>
    <text x="224" y="186" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">Architecture</text>
    <text x="224" y="200" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">Board prüft</text>
    <text x="224" y="220" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#7C3AED" letter-spacing="0.06em">CHIEF ARCHITECT</text>
  </g>
  <g fill="#1E2327"><polygon points="284,180 304,172 304,188"/></g>
  <!-- 03 Decide -->
  <g>
    <rect x="308" y="120" width="104" height="120" fill="#FFFFFF" stroke="#1E2327" stroke-width="1.4" rx="2"/>
    <rect x="308" y="120" width="104" height="22" fill="#FFD24A"/>
    <text x="360" y="136" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#1E2327" letter-spacing="0.08em">03 · DECIDE</text>
    <text x="360" y="166" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="800" fill="#1E2327">VERDICT</text>
    <text x="360" y="186" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">Approve · Reject</text>
    <text x="360" y="200" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">Iterate</text>
    <text x="360" y="220" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#7C3AED" letter-spacing="0.06em">EA-BOARD</text>
  </g>
  <g fill="#1E2327"><polygon points="420,180 440,172 440,188"/></g>
  <!-- 04 ADR -->
  <g>
    <rect x="444" y="120" width="104" height="120" fill="#FFFFFF" stroke="#1E2327" stroke-width="1.4" rx="2"/>
    <rect x="444" y="120" width="104" height="22" fill="#7C3AED"/>
    <text x="496" y="136" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#FAF6EC" letter-spacing="0.08em">04 · ADR</text>
    <text x="496" y="166" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="800" fill="#1E2327">RECORD</text>
    <text x="496" y="186" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">Decision Record</text>
    <text x="496" y="200" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#5A6066">im Repo</text>
    <text x="496" y="220" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#7C3AED" letter-spacing="0.06em">ARCHIV · GIT</text>
  </g>

  <!-- Step 05 Implement — centered below, with loop back -->
  <g>
    <rect x="240" y="280" width="120" height="76" fill="#1E2327" rx="2"/>
    <text x="300" y="302" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#FFD24A" letter-spacing="0.08em">05 · IMPLEMENT</text>
    <text x="300" y="324" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="800" fill="#FAF6EC">DELIVERY</text>
    <text x="300" y="344" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#FAF6EC" opacity="0.78">Domain-Team baut nach ADR</text>
  </g>

  <!-- loop arrow: 04 down then left to 05 -->
  <g stroke="#5A6066" stroke-width="1.6" fill="none">
    <path d="M496 240 L496 270 L362 270" />
  </g>
  <polygon points="362,270 372,266 372,274" fill="#5A6066"/>

  <!-- loop arrow: 05 left up to 01 (feedback) -->
  <g stroke="#5A6066" stroke-width="1.4" fill="none" stroke-dasharray="4 4">
    <path d="M240 318 L88 318 L88 244" />
  </g>
  <polygon points="84,248 92,248 88,238" fill="#5A6066"/>
  <text x="160" y="334" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#5A6066" letter-spacing="0.08em">FEEDBACK · LESSONS LEARNED</text>

  <!-- Footer caption -->
  <text x="300" y="386" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#5A6066" letter-spacing="0.04em">Architecture Decision Record (ADR) bindet Entscheidung an Code · Review-Zyklus alle 2 Wochen</text>
</svg>
