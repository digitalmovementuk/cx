<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Inter, Arial, sans-serif" role="img" aria-label="Geplanter schlanker Prozess gegenüber demselben Prozess nach Jahren organischen Wachstums; Effektivität und Effizienz sinken">
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a948a"/>
    </marker>
  </defs>
  <style>
    .lbl{fill:#1E2327;font-weight:700;font-size:13px}
    .cap{fill:#6b665c;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
    .box{fill:#efe9db;stroke:#d8cfbc;stroke-width:1.5;rx:8}
    .add{fill:#FFE2C2;stroke:#FF7A00;stroke-width:1.5}
    .bt{fill:#1E2327;font-weight:700;font-size:12.5px}
    .lk{stroke:#9a948a;stroke-width:2;fill:none}
  </style>

  <!-- Row A: planned / lean -->
  <text x="40" y="58" class="cap">Geplant</text>
  <g>
    <rect x="224" y="70" width="96" height="44" rx="8" class="box"/><text x="272" y="97" text-anchor="middle" class="bt">Eingang</text>
    <rect x="356" y="70" width="96" height="44" rx="8" class="box"/><text x="404" y="97" text-anchor="middle" class="bt">Prüfung</text>
    <rect x="488" y="70" width="96" height="44" rx="8" class="box"/><text x="536" y="97" text-anchor="middle" class="bt">Abschluss</text>
    <line x1="320" y1="92" x2="356" y2="92" class="lk" marker-end="url(#ar)"/>
    <line x1="452" y1="92" x2="488" y2="92" class="lk" marker-end="url(#ar)"/>
  </g>
  <text x="40" y="135" class="lbl" fill="#6b665c">3 Schritte · dient direkt dem Ergebnis</text>

  <!-- Row B: grown / bloated -->
  <text x="40" y="208" class="cap">Heute gewachsen</text>
  <g>
    <rect x="40"  y="220" width="96" height="44" rx="8" class="box"/><text x="88"  y="247" text-anchor="middle" class="bt">Eingang</text>
    <rect x="160" y="220" width="96" height="44" rx="8" class="add"/><text x="208" y="240" text-anchor="middle" class="bt">Sonder-</text><text x="208" y="255" text-anchor="middle" class="bt">prüfung</text>
    <rect x="280" y="220" width="96" height="44" rx="8" class="box"/><text x="328" y="247" text-anchor="middle" class="bt">Prüfung</text>
    <rect x="400" y="220" width="96" height="44" rx="8" class="add"/><text x="448" y="247" text-anchor="middle" class="bt">Workaround</text>
    <rect x="520" y="220" width="96" height="44" rx="8" class="add"/><text x="568" y="247" text-anchor="middle" class="bt">Freigabe</text>
    <rect x="640" y="220" width="96" height="44" rx="8" class="box"/><text x="688" y="247" text-anchor="middle" class="bt">Abschluss</text>
    <line x1="136" y1="242" x2="160" y2="242" class="lk" marker-end="url(#ar)"/>
    <line x1="256" y1="242" x2="280" y2="242" class="lk" marker-end="url(#ar)"/>
    <line x1="376" y1="242" x2="400" y2="242" class="lk" marker-end="url(#ar)"/>
    <line x1="496" y1="242" x2="520" y2="242" class="lk" marker-end="url(#ar)"/>
    <line x1="616" y1="242" x2="640" y2="242" class="lk" marker-end="url(#ar)"/>
    <!-- rework loop: Freigabe back to Prüfung -->
    <path d="M568 264 C568 300 328 300 328 268" class="lk" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <text x="448" y="296" text-anchor="middle" class="lbl" fill="#FF7A00">Rückläufer / Schleife</text>
  </g>
  <text x="40" y="335" class="lbl" fill="#6b665c">6 Schritte · 3 Zusätze (orange) · Doppelarbeit &amp; Wartezeit</text>

  <!-- Effectiveness / Efficiency drop -->
  <text x="40" y="378" class="cap">Effektivität &amp; Effizienz sinken</text>
  <g>
    <text x="40" y="404" class="lbl">Effektivität</text>
    <rect x="160" y="392" width="240" height="14" rx="7" fill="#efe9db"/>
    <rect x="160" y="392" width="108" height="14" rx="7" fill="#FF7A00"/>
    <text x="700" y="404" text-anchor="end" class="lbl" fill="#FF7A00">▼</text>
  </g>
  <g>
    <text x="40" y="426" class="lbl">Effizienz</text>
    <rect x="160" y="414" width="240" height="14" rx="7" fill="#efe9db"/>
    <rect x="160" y="414" width="92" height="14" rx="7" fill="#FF7A00"/>
    <text x="700" y="426" text-anchor="end" class="lbl" fill="#FF7A00">▼</text>
  </g>
</svg>
